# Auto-update kode redeem: jalankan worker tiap jam, commit codes.json,
# push → memicu rebuild Cloudflare Pages.
#
# KENAPA commit (bukan sekadar ping deploy-hook): codes.json harus BERTAHAN
# antar-build supaya:
#   - firstSeenAt tiap kode tetap (label "Terpantau N hari lalu" akurat),
#   - arsip kode kadaluarsa terus terakumulasi (jadi database).
# Kalau tiap build mulai dari nol, kedua hal itu kereset.

name: update-codes

on:
  schedule:
    # FALLBACK HARIAN saja. Pemicu UTAMA tiap jam = Cloudflare Cron Worker
    # (cron/worker.js) yang memanggil workflow_dispatch — jauh lebih andal
    # daripada cron GitHub (sering ditunda/di-drop). Jadwal harian ini cuma
    # jaring pengaman bila CF cron mati. Hindari dobel-jalan tiap jam.
    - cron: "27 3 * * *"
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

# Cukup satu run sekaligus — TAPI JANGAN dibatalkan, ANTREKAN.
#
# Dulu cancel-in-progress: true. Masalahnya run ini MENGUPLOAD VIDEO di tengah
# jalan, sedangkan video-state.json baru di-commit di akhir. Kalau run dibunuh
# setelah mengupload tapi sebelum commit, video-video itu jadi HANTU: sudah
# tayang di YouTube tapi tak tercatat sebagai "sudah divideokan" — run berikutnya
# membuatnya lagi.
#
# Kejadian 3 Agu 2026: run terjadwal 13:46 UTC dibunuh oleh dispatch 14:00 UTC
# setelah sempat mengupload 9 video. Run 14:02 membuat ulang KESEMBILANNYA →
# 9 pasang video kembar, dan jatah upload harian (45) habis oleh pekerjaan dobel.
#
# Mengantre aman: run rutin 1-2 menit, yang berat (banyak video) ~9 menit, jadi
# tak akan menumpuk pada jadwal per jam.
concurrency:
  group: update-codes
  cancel-in-progress: false

permissions:
  contents: write # untuk commit codes.json

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # history penuh → rebase saat push tahan-balapan andal (bukan shallow)

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Tarik data time-sensitive (kode, event, berita, Roblox)
        env:
          # Proxy Cloudflare untuk sumber yang memblokir IP GitHub Actions
          # (whiteoutsurvival-community, wuwastatus). Kosong = fetch langsung saja.
          # URL proxy boleh dipasang sebagai Variable ATAU Secret — dua-duanya
          # diterima supaya tak gagal senyap kalau ditaruh di tab yang berbeda.
          KODEGG_PROXY: ${{ vars.KODEGG_PROXY || secrets.KODEGG_PROXY }}
          KODEGG_PROXY_KEY: ${{ secrets.KODEGG_PROXY_KEY }}
          # Penyetel pemantau ekor-panjang Roblox Den (semua opsional, ada
          # nilai bawaan di kode): berapa slug baru dinilai per run, ambang
          # pemain untuk mulai dipantau, dan jatah backfill halaman Den per run.
          DEN_SCOUT_MAX: ${{ vars.DEN_SCOUT_MAX }}
          DEN_SCOUT_MIN_PLAYERS: ${{ vars.DEN_SCOUT_MIN_PLAYERS }}
          DEN_BACKFILL_MAX: ${{ vars.DEN_BACKFILL_MAX }}
          # Penyetel cross-check editorial: ambang pemain tingkat 1, tiap berapa
          # jam tingkat 1 jalan, dan jatah tingkat 2 (sapuan harian) per run.
          CROSSCHECK_MIN: ${{ vars.CROSSCHECK_MIN }}
          CROSS_INTERVAL_H: ${{ vars.CROSS_INTERVAL_H }}
          CROSS_DAILY_MAX: ${{ vars.CROSS_DAILY_MAX }}
          # Umur (hari) kode CEK DULU sebelum disapu ke arsip. Kosong = 365.
          AGE_EXPIRE_DAYS: ${{ vars.AGE_EXPIRE_DAYS }}
          # Usia maks (hari) kode yang boleh disebut "kode baru" (notif + video).
          # Kosong = 7. Kode tanpa tanggal rilis tak terpengaruh.
          NEW_MAX_AGE_DAYS: ${{ vars.NEW_MAX_AGE_DAYS }}
        run: |
          node worker/fetch-codes.mjs || echo "codes gagal, lanjut"
          node worker/fetch-events.mjs || echo "events gagal, lanjut"
          node worker/fetch-news.mjs || echo "news gagal, lanjut"
          node worker/fetch-roblox.mjs || { echo "::warning::fetch-roblox GAGAL — data Roblox tidak diperbarui run ini"; echo "roblox gagal, lanjut"; }
          node worker/fetch-roblox-icons.mjs || echo "roblox icons gagal, lanjut"

      # Pemantau sumber — 1×/hari (jam 01 UTC / 08 WIB). Melapor saja: game baru
      # di sumber yang sudah dipakai, game yang dihapus sumber, dan kandidat
      # cross-check editorial. Temuannya muncul di ringkasan run + warning.
      - name: Pantau sumber kode (harian)
        run: |
          if [ "${FORCE_DISCOVER:-}" != "1" ] && [ "$(date -u +%H)" != "01" ]; then
            echo "bukan jam pemantauan (01 UTC) — lewati."; exit 0
          fi
          node worker/discover-sources.mjs || echo "pemantau sumber gagal, lanjut"

      # Audit konsistensi data — BACA-SAJA & non-blocking. Bug data di proyek ini
      # jenisnya menumpuk diam-diam lintas-run (kode aktif-sekaligus-expired
      # sempat sampai 521 kode di 45 game sebelum ketahuan). Ini melaporkannya
      # sejak kemunculan pertama. SENGAJA tak pernah menggagalkan run: audit yang
      # bikin pipeline merah malah bikin merahnya diabaikan.
      - name: Audit konsistensi data (lapor saja)
        run: |
          node worker/audit-data.mjs | tee audit.txt || true
          # Temuan TINGGI dinaikkan jadi warning GitHub → kelihatan di ringkasan
          # run tanpa perlu membuka log.
          if grep -q '^\[TINGGI\]' audit.txt; then
            echo "::warning::Audit data menemukan masalah TINGGI — lihat log langkah ini."
          fi
          rm -f audit.txt

      # Auto-video YouTube: kode baru run ini → Short (maks 3/hari, Unlisted).
      # Aman-dilewati bila YT belum di-set. Jalan SEBELUM commit → video-state.json
      # ikut ter-commit sekali jalan (tak nambah deploy). Lihat DEPLOY-YOUTUBE.md.
      - name: Auto-video YouTube (kode baru → Shorts)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Multi-project (opsional) — nambah kuota query saat game makin banyak.
          # Kosong = diabaikan (rotasi cuma aktif bila project ke-2+ terisi).
          YT_CLIENT_ID_2: ${{ secrets.YT_CLIENT_ID_2 }}
          YT_CLIENT_SECRET_2: ${{ secrets.YT_CLIENT_SECRET_2 }}
          YT_REFRESH_TOKEN_2: ${{ secrets.YT_REFRESH_TOKEN_2 }}
          YT_CLIENT_ID_3: ${{ secrets.YT_CLIENT_ID_3 }}
          YT_CLIENT_SECRET_3: ${{ secrets.YT_CLIENT_SECRET_3 }}
          YT_REFRESH_TOKEN_3: ${{ secrets.YT_REFRESH_TOKEN_3 }}
          # Kosong = pakai default make-videos.mjs (public). Isi hanya bila mau
          # override, mis. YT_PRIVACY=unlisted saat menahan buat review.
          YT_PRIVACY: ${{ vars.YT_PRIVACY || secrets.YT_PRIVACY }}
          # JANGAN taruh angka default di sini — nilai workflow menang atas default
          # di kode, jadi angka usang tersangkut diam-diam (kejadian: kode sudah 30,
          # workflow masih memaksa 3 → video jatuh ke manual dengan alasan "kuota
          # harian"). Kosong = pakai default make-videos.mjs.
          VIDEO_MAX_PER_DAY: ${{ vars.VIDEO_MAX_PER_DAY }}
          # VIDEO_SKIP_PLAYLIST=1 → video tetap diupload TAPI playlist tak dibuat
          # lewat API. Dipakai saat sengaja menambah banyak game sekaligus, supaya
          # jatah playlist baru YouTube (~10/hari) tersisa untuk game yang benar-
          # benar dapat kode baru. Daftar video yang perlu playlist manual dicetak
          # di log + ringkasan run. Hapus variabelnya begitu kuota pulih.
          VIDEO_SKIP_PLAYLIST: ${{ vars.VIDEO_SKIP_PLAYLIST }}
          PYTHON: python3
        run: |
          if [ -z "$YT_REFRESH_TOKEN" ]; then echo "YT belum di-set — lewati auto-video (lihat DEPLOY-YOUTUBE.md)."; exit 0; fi
          # Cek dulu ADA kerja video (pakai fs saja, TANPA deps berat). Sebagian
          # besar run tak punya video baru → lewati install (~15-30 dtk) & render,
          # hemat menit Actions. make-videos --check exit 1 bila tak ada kerja.
          if ! node worker/make-videos.mjs --check; then
            echo "tak ada kerja video — lewati install deps & render."
            exit 0
          fi
          pip install --quiet --disable-pip-version-check edge-tts || pip3 install --quiet edge-tts
          npm install @napi-rs/canvas @ffmpeg-installer/ffmpeg googleapis --no-save --no-audit --no-fund
          node worker/make-videos.mjs || echo "auto-video gagal, lanjut"

      # Sinkron peta game→playlist YouTube (dibaca situs utk tautan "Video di
      # YouTube" per game). SELALU jalan bila YT di-set — BUKAN cuma saat ada
      # video baru. Kenapa terpisah dari blok video di atas: playlist bisa dibuat
      # MANUAL (video upload-manual utk game gede), di jam yang tak ada video
      # otomatis. Kalau sync nebeng blok video, jam-jam itu ke-skip → tombol tak
      # pernah muncul. googleapis di-install di sini; bila blok video di atas
      # sudah memasangnya (jam ada video baru), install ini jadi no-op cepat.
      - name: Sync playlist YouTube (peta game→playlist)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ -z "$YT_REFRESH_TOKEN" ]; then echo "YT belum di-set — lewati sync playlist."; exit 0; fi
          npm install googleapis --no-save --no-audit --no-fund
          node worker/fetch-yt-playlists.mjs || echo "sync playlist gagal, lanjut"

      # Video di atas kuota upload otomatis → Release harian (gampang dicari &
      # diambil satuan) + artifact per-run sbg cadangan. Keduanya dibersihkan
      # setelah 14 hari; kode redeem biasanya basi jauh sebelum itu.
      - name: Ringkas & rilis video manual
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(_video-out/*.mp4)
          if [ ${#files[@]} -eq 0 ]; then echo "tak ada video manual run ini."; exit 0; fi
          # slug game (buang prefix tanggal) → dipakai utk nama artifact & ringkasan
          slugs=$(printf '%s\n' "${files[@]}" | xargs -n1 basename | sed 's/\.mp4$//; s/^[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-//')
          echo "ART_NAME=shorts-$(date -u +%F)-${#files[@]}video-$(echo "$slugs" | head -2 | paste -sd- -)" >> "$GITHUB_ENV"
          {
            echo "### 🎬 ${#files[@]} video siap upload manual"
            echo "$slugs" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          TAG="videos-$(date -u +%F)"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Video Shorts $(date -u +%F)" \
            --notes "Video KodeGG yang lewat kuota upload otomatis — siap diupload manual. Tiap video punya .jpg (thumbnail) dan .txt (judul/deskripsi/tag)."
          gh release upload "$TAG" _video-out/* --clobber
          # buang rilis lebih tua dari 14 hari biar halaman Releases tak menumpuk
          for tag in $(gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^videos-' || true); do
            d="${tag#videos-}"
            if [ $(( ( $(date -u +%s) - $(date -u -d "$d" +%s) ) / 86400 )) -gt 14 ]; then
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done

      - name: Simpan video sisa sbg artifact (cadangan)
        if: ${{ env.ART_NAME != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ART_NAME }}
          path: _video-out/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit bila ada perubahan
        run: |
          if git diff --quiet -- worker/data/ site/public/assets/roblox/; then
            echo "Tidak ada perubahan data."
            exit 0
          fi
          git config user.name "kodegg-bot"
          git config user.email "bot@kodegg.com"
          git add worker/data/ site/public/assets/roblox/

          # ── Hemat build Cloudflare Pages (limit 500/bln) ──────────────────
          # Data di-commit TIAP JAM (firstSeenAt/arsip persist di repo), tapi
          # situs tak perlu DEPLOY tiap jam: build.mjs re-fetch data segar tiap
          # build, jadi konten selalu terbaru saat build jalan. Deploy hanya bila
          # run ini bawa KODE BARU (konten penting → muncul seketika, sinkron dg
          # notif), ATAU 10×/hari (~tiap 2-3 jam) sbg lantai (event/news/pemain
          # tak basi lama).
          # Selain itu → commit pakai [skip ci] → Cloudflare LEWATI build. Kode
          # tetap terdeteksi & video tetap dibuat tiap jam (langkah terpisah).
          NEWCODES=0
          for f in worker/data/new-codes.json worker/data/new-roblox-codes.json; do
            if [ -f "$f" ] && node -e "process.exit(((JSON.parse(require('fs').readFileSync('$f','utf8')).codes)||[]).length>0?0:1)" 2>/dev/null; then NEWCODES=1; fi
          done
          # Playlist YouTube baru = tombol "Video di YouTube" BARU di halaman game
          # → perubahan tampilan, wajib dideploy. Dulu tak dihitung: entri playlist
          # sering nyusul di run TANPA kode baru (mis. video dibuat manual, atau
          # playlist run sebelumnya baru ke-sync) → commit [skip ci] → tombolnya
          # baru nongol saat build lantai berikutnya (nganggur sampai ~3 jam).
          # Kejadian nyata: Adopt Me! (playlist masuk 10:02 WIB, situs masih build
          # 09:01 WIB → user liat halaman tanpa tombol padahal videonya sudah ada).
          # Ongkos terukur: 9 kejadian / 12 hari ≈ +0,75 build/hari, aman thd 500/bln.
          YTPL=0
          if ! git diff --cached --quiet -- worker/data/yt-playlists.json; then YTPL=1; fi
          # Kode yang HILANG juga wajib terbit, bukan cuma yang bertambah.
          # fetch-roblox menandai run yang menerapkan vonis uji lapangan BARU —
          # kode yang user buktikan mati dengan mencobanya langsung di dalam game.
          # Selama gerbang ini cuma melihat kode baru, situs bisa memajang kode
          # yang kita SUDAH TAHU mati sampai jam lantai berikutnya (7 Agu 2026:
          # 22 kode, berjam-jam). Sempit & jarang — vonis diterapkan ulang tiap
          # run, jadi ini hanya menyala pada run pertama sesudah user mencatat uji.
          UJI=0
          if [ -f worker/data/deploy-alasan.json ] && node -e "process.exit((JSON.parse(require('fs').readFileSync('worker/data/deploy-alasan.json','utf8')).alasan||[]).length>0?0:1)" 2>/dev/null; then UJI=1; fi
          # Lantai deploy 10×/hari (~tiap 2-3 jam) di jam UTC berikut → ~300
          # build/bln pasti; sisanya dari run berkode-baru. Total nyaman <500.
          H=$(date -u +%H)
          case " 00 02 05 07 10 12 14 17 19 22 " in
            *" $H "*) FLOOR=1 ;; *) FLOOR=0 ;;
          esac
          if [ "$NEWCODES" = "1" ] || [ "$FLOOR" = "1" ] || [ "$YTPL" = "1" ] || [ "$UJI" = "1" ]; then
            git commit -m "chore: update data (kode/event/berita)"
          else
            git commit -m "chore: update data (kode/event/berita) [skip ci]"
          fi
          # Push tahan-balapan: remote bisa MAJU di antara checkout & push (push
          # manual atau run lain) → push ditolak "fetch first". Solusi: rebase di
          # atas remote lalu ulang. Saat konflik JSON, data bot (fetch tersegar
          # run ini) MENANG (-X theirs); kalau ada game baru ditambah manual,
          # datanya nyusul otomatis di run jam berikutnya (bot baca games.mjs).
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push berhasil (percobaan $i)"; exit 0
            fi
            echo "push ditolak — integrasikan remote lalu ulang ($i)"
            git pull --rebase -X theirs --autostash origin main \
              || { git rebase --abort 2>/dev/null || true; }
            # `-X theirs` memenangkan versi LOKAL, dan untuk roblox-codes.json
            # itu memang yang diinginkan (potret tarikan tersegar menang). Tapi
            # video-state.json & video-harian.json bukan potret melainkan CATATAN
            # KUMULATIF — menimpanya menghapus apa yang run lain sudah kerjakan.
            #
            # 8 Agu 2026: run A mengunggah 39 video & menulis todayCount 65, run
            # B menimpanya dengan 43 dari state basi. B tak melihat jejak A, lalu
            # mengulang 9 game yang sama; batas 65/hari jebol jadi 82 unggahan
            # dan kuota harian YouTube tembus 100%.
            node worker/gabung-state.mjs origin/main || echo "  (gabung state dilewati)"
            if ! git diff --quiet -- worker/data/video-state.json worker/data/video-harian.json; then
              git add worker/data/video-state.json worker/data/video-harian.json
              git commit --amend --no-edit --quiet
            fi
          done
          echo "::error::gagal push setelah 5 percobaan"; exit 1
        # CATATAN [skip ci]: Cloudflare Pages menghormati [skip ci] → MELEWATI
        # build. Dipakai SENGAJA di atas untuk menekan jumlah build (limit 500/
        # bln) pada run yang cuma churn rutin (jumlah pemain). Run berkode-baru
        # ATAU 10×/hari (jam lantai) ATAU yg nambah playlist YouTube TAK memakai tag
        # → Cloudflare build & situs update.
        # [skip ci] tak memengaruhi Actions: workflow ini dipicu schedule/
        # workflow_dispatch, BUKAN push, jadi commit ini tak memicu ulang dirinya.

      # CATATAN: notifikasi push DIPINDAH ke workflow terpisah (push-notify.yml).
      # Dulu langkah itu ada di sini dan MENAHAN run 7-12 menit hanya untuk
      # menunggu deploy Cloudflare live — run jadi 24 menit padahal separuhnya
      # cuma menunggu pihak lain. Sekarang update-codes selesai begitu
      # pekerjaannya kelar, notifikasi menyusul lewat workflow_run.
