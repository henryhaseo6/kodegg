# Laporan harian KodeGG — satu gambaran utuh tiap pagi.
#
# Kenapa dijadwalkan: pemeriksaan proyek ini tersebar di banyak tempat, dan
# masalah hanya ketahuan kalau kebetulan ada yang membuka tempat yang tepat.
# Hampir semua bug besar 2-4 Agu 2026 ditemukan begitu. Ini menariknya jadi satu
# laporan yang siap dibaca tiap pagi tanpa perlu diminta.
#
# Hasilnya muncul di ringkasan run (GITHUB_STEP_SUMMARY) dan riwayat ringkasnya
# di-commit ke worker/data/laporan-riwayat.json supaya TREN kebaca lintas hari.
name: laporan-harian

on:
  schedule:
    # JARING PENGAMAN saja. Pemicu UTAMA = Cloudflare Cron Worker (cron/worker.js)
    # yang men-dispatch jam 00:30 UTC / 07:30 WIB.
    #
    # Kenapa dipindah: cron GitHub menunda laporan ini makin jauh tiap hari —
    # 02:06 (26 Agu) → 10:02 (27 Agu) → 11:34 (28 Agu) UTC. Laporan yang gunanya
    # dibaca tiap PAGI jadi tiba sore, dan alarm seperti "MOBILE beku" baru
    # terbaca setengah hari setelah pantas ditindak.
    #
    # Jam segini (bukan 00:30 lagi) supaya kalau CF-nya hidup, jadwal ini tidak
    # bertabrakan dengannya. Kalaupun dua-duanya jalan, riwayat menyimpan satu
    # entri per hari (lihat laporan-harian.mjs) — yang belakangan menimpa.
    - cron: "17 3 * * *" # 10:17 WIB
  workflow_dispatch:

permissions:
  contents: write
  actions: read # baca riwayat run top50-video & codes-roundup (lihat "Video harian" di laporan)

concurrency:
  group: laporan-harian
  cancel-in-progress: false

jobs:
  laporan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Susun laporan
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Dipakai memeriksa apakah video harian (Top 50, roundup) benar-benar
          # dibuat. GITHUB_TOKEN TIDAK otomatis ada di env langkah — wajib
          # dilewatkan eksplisit. GITHUB_REPOSITORY sudah disediakan runner.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install googleapis --no-save --no-audit --no-fund
          node worker/laporan-harian.mjs | tee laporan.txt
          # Temuan TINGGI dinaikkan jadi warning supaya kelihatan tanpa membuka log.
          if grep -q '⚠️' laporan.txt; then echo "::warning::Laporan harian memuat peringatan — lihat ringkasan run."; fi
          rm -f laporan.txt

      - name: Commit riwayat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/data/laporan-riwayat.json || true
          git diff --cached --quiet || git commit -m "chore: riwayat laporan harian [skip ci]"
          git push || echo "push gagal (tak fatal)"
