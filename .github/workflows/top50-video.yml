# Auto-generate video "Top 50 Roblox Harian" tiap ganti hari (00:30 WIB) dari
# data player-count di R2 (H-1). Render (musik+SFX+emoji+timeline+thumbnail
# collage) → upload YouTube PUBLIC + masuk playlist + simpan sbg artifact.
#
# Data H-1 dipadatkan ke R2 (`daily/<date>.json`) oleh cron Worker pas ganti hari
# WIB (~00:00). Job ini jalan 00:30 WIB → data sudah siap. Kalau R2 kosong
# (mis. secret WORKER_URL/TRIGGER_KEY belum di-set), otomatis fallback live charts.

name: top50-video

on:
  schedule:
    # JARING PENGAMAN saja. Pemicu UTAMA = Cloudflare Cron Worker (cron/worker.js)
    # yang men-dispatch 17:30 UTC / 00:30 WIB — jam yang sama seperti dulu, bedanya
    # sekarang benar-benar ditepati.
    #
    # Kenapa dipindah: cron GitHub menerbitkan video ini kapan saja. 27 Agu terbit
    # 08:42 WIB, 24 Agu jadwalnya DIJATUHKAN sama sekali (tak ada video hari itu),
    # dan 29 Agu melompat balik ke 03:02 WIB. "Top 50 HARIAN" yang datang tengah
    # hari bukan lagi video harian.
    #
    # Jam segini supaya tak bertabrakan dengan CF kalau CF-nya hidup, TAPI tetap
    # di hari WIB yang sama — H-1 otomatis harus jatuh ke tanggal yang sama dengan
    # run CF, kalau tidak jaring pengaman ini malah membuat video tanggal lain.
    # Kalau dua-duanya jalan, penjaga "satu tanggal satu video"
    # (src/video-harian.mjs) menolak yang kedua sebelum render.
    - cron: "23 20 * * *" # 03:23 WIB
  workflow_dispatch:
    inputs:
      date:
        description: "Tanggal data (YYYY-MM-DD, WIB). Kosong = H-1 otomatis."
        type: string
        default: ""
      limit:
        description: "Jumlah game (1-50)"
        type: string
        default: "50"
      source:
        description: "Sumber data"
        type: choice
        options: ["auto", "live"]
        default: "auto"
      upload:
        description: "Upload ke YouTube (PUBLIC)"
        type: boolean
        default: true

concurrency:
  group: top50-video
  cancel-in-progress: true

# Workflow ini MENULIS ke repo (commit video-harian.json & antrean thumbnail),
# jadi butuh izin tulis eksplisit. Tanpa blok ini GITHUB_TOKEN bersifat baca-saja
# dan langkah push gagal "Permission denied to github-actions[bot]" — TAPI hanya
# SETELAH video benar-benar terbit, jadi kegagalannya menipu: videonya ada di
# YouTube, catatannya tidak. Terjadi dua malam berturut-turut (7 & 8 Agu 2026),
# dan akibatnya penjaga duplikat jadi buta untuk tanggal itu.
permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install deps video (canvas + ffmpeg + googleapis)
        run: cd worker && npm run deps:video

      - name: Render Top 50 (+ upload PRIVATE)
        env:
          # Baca database R2 (H-1). Kosong → fallback live charts (kurang akurat).
          WORKER_URL: ${{ secrets.WORKER_URL }}
          TRIGGER_KEY: ${{ secrets.TRIGGER_KEY }}
          # Upload YouTube (reuse secret pipeline Shorts). PRIVATE = draft.
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Multi-project (opsional) — nambah kuota. Kosong = diabaikan.
          YT_CLIENT_ID_2: ${{ secrets.YT_CLIENT_ID_2 }}
          YT_CLIENT_SECRET_2: ${{ secrets.YT_CLIENT_SECRET_2 }}
          YT_REFRESH_TOKEN_2: ${{ secrets.YT_REFRESH_TOKEN_2 }}
          YT_CLIENT_ID_3: ${{ secrets.YT_CLIENT_ID_3 }}
          YT_CLIENT_SECRET_3: ${{ secrets.YT_CLIENT_SECRET_3 }}
          YT_REFRESH_TOKEN_3: ${{ secrets.YT_REFRESH_TOKEN_3 }}
          YT_PRIVACY: public
        run: |
          # Kuras antrean thumbnail yang GAGAL dipasang (kuota habis) sebelum
          # merender hari ini. Thumbnail top50 deterministik dari tanggalnya, jadi
          # cukup dirender ulang lalu dipasang ke video yang sudah tayang.
          node -e "try{for(const x of require('./worker/data/pending-thumbs.json').filter(e=>e.kind==='top50'))console.log(x.date+' '+x.videoId)}catch(e){}" > /tmp/pt.txt || true
          while read -r D V; do
            [ -z "$V" ] && continue
            echo "▶ pasang ulang thumbnail $V (tanggal $D)"
            node worker/make-top50.mjs --date="$D" --thumb-only="$V" || echo "  gagal, tetap di antrean"
          done < /tmp/pt.txt
          ARGS="--limit=${{ inputs.limit || '50' }}"
          [ -n "${{ inputs.date }}" ] && ARGS="$ARGS --date=${{ inputs.date }}"
          [ "${{ inputs.source }}" = "live" ] && ARGS="$ARGS --source=live"
          # workflow_dispatch dg upload=false → jangan upload; schedule → upload.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.upload }}" != "true" ]; then ARGS="$ARGS --no-upload"; fi
          echo "make-top50 $ARGS"
          node worker/make-top50.mjs $ARGS

      - name: Simpan video sbg artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top50-video
          path: |
            _video-out/top50-*.mp4
            _video-out/top50-*.txt
            _video-out/top50-*.png
          if-no-files-found: warn
          retention-days: 14

      # SIMPAN ANTREAN THUMBNAIL. Tanpa ini, simpanPending() menulis ke runner
      # yang langsung dihapus — jaring pengamannya ada, talinya tak terikat.
      # Terlihat 5 Agu 2026: video 4 Agu terbit tanpa thumbnail kustom karena
      # kuota habis, dan kegagalannya TIDAK pernah sampai ke antrean, jadi tak
      # ada satu pun retry yang berjalan.
      - name: Simpan antrean thumbnail
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A worker/data/pending-thumbs.json worker/data/pending-thumbs 2>/dev/null || true
          # video-harian.json WAJIB ikut: itu catatan "tanggal ini sudah dibuat".
          # Tanpa di-commit, penjaganya lupa tiap run dan duplikat bisa terulang.
          git add -A worker/data/video-harian.json 2>/dev/null || true
          # kuota-yt.json: video harian ini membakar kuota YouTube yang SAMA
          # dengan upload per jam. Tanpa ikut di-commit, pemakaiannya cuma hidup
          # di runner ini lalu hilang, dan rem unit di make-videos.mjs mengira
          # kuotanya masih utuh — persis cara kuota tembus tanpa ada yang tahu.
          git add -A worker/data/kuota-yt.json 2>/dev/null || true
          git diff --cached --quiet && echo "antrean tak berubah" && exit 0
          git commit -m "chore(thumb): antrean thumbnail tertunda [skip ci]"
          # PUSH TAHAN-BALAPAN. Dulu satu baris `git pull --rebase --autostash
          # -q || true` diikuti `git push -q`, dan 19 Agu 2026 itu gagal persis
          # seperti yang bisa diduga: run per jam menguras pending-thumbs.json
          # sementara run ini menambahinya -> rebase konflik -> `|| true` menelan
          # kegagalannya -> `git push` jalan di HEAD TERLEPAS di tengah rebase ->
          # exit 128. Videonya sudah terbit, tapi catatannya hilang semua:
          # video-harian (penjaga duplikat), kuota, dan antrean thumbnail video
          # itu sendiri - yang berarti thumbnail-nya tak akan pernah terpasang.
          #
          # Pola ini menyalin yang sudah dipakai update-codes.yml: coba push,
          # kalau ditolak rebase lalu GABUNG berkas kumulatif (gabung-state.mjs)
          # sebelum mengulang. `-X theirs` sendirian tidak cukup - ia memenangkan
          # versi lokal dan dengan itu menghapus jejak run lain.
          for i in 1 2 3 4 5; do
            if git push -q; then echo "push berhasil (percobaan $i)"; exit 0; fi
            echo "push ditolak - integrasikan remote lalu ulang ($i)"
            git pull --rebase -X theirs --autostash -q origin main \
              || { git rebase --abort 2>/dev/null || true; }
            node worker/gabung-state.mjs origin/main || echo "  (gabung state dilewati)"
            if ! git diff --quiet -- worker/data/pending-thumbs.json worker/data/video-harian.json worker/data/kuota-yt.json; then
              # pending-thumbs (DIREKTORI) hanya ada saat antrean tak kosong - ia dibuat
              # saat thumbnail gagal dipasang, lalu dihapus saat antrean terkuras. Digabung
              # ke satu pathspec ketat, ketidakhadirannya jadi `fatal: pathspec did not
              # match any files` -> exit 128 -> loop retry ini mati SEBELUM push. 24 Agu
              # 2026 persis begitu: video terbit, tapi catatan video-harian & kuota hari
              # itu hilang - kerusakan yang blok komentar di atas justru dibuat untuk
              # mencegah. Jalur normal di atas sudah menjaganya; di sini dulu tidak.
              git add -A worker/data/pending-thumbs.json worker/data/video-harian.json worker/data/kuota-yt.json
              git add -A worker/data/pending-thumbs 2>/dev/null || true
              git commit --amend --no-edit --quiet
            fi
          done
          echo "::error::gagal push antrean thumbnail setelah 5 percobaan"; exit 1
