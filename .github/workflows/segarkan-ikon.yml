# Segarkan ikon game — BERGILIR TIAP HARI, seluruh katalog tuntas dalam 30 hari.
#
# KENAPA PERLU. Kedua pengambil ikon idempoten: mereka MELEWATI berkas yang sudah
# ada. Itu benar untuk run harian (hemat ratusan permintaan), tapi akibatnya ikon
# yang sekali terunduh TAK PERNAH diperbarui — game yang berganti ikon (rebrand,
# event musiman, anniversary) memakai gambar lama selamanya.
#
# Bukan dugaan, diuji 15 Agu 2026 terhadap ikon yang ditarik 19-21 Jul:
#   mobile : 3 dari 3 sampel BERUBAH (drr, dtrav, isekai)
#   Roblox : 4 dari 8 sampel BERUBAH (animevanguards, adoptme, fisch,
#            volleyballlegends)
# Encoder-nya deterministik (sumber sama → byte identik, diuji), jadi perubahan
# itu memang dari penerbit gamenya, bukan artefak kompresi.
#
# KENAPA BERGILIR, BUKAN SEKALIGUS SEBULAN SEKALI. Katalog Roblox 632 game;
# menariknya serentak berarti ratusan permintaan dalam satu run, dan satu commit
# raksasa berisi ratusan gambar. Dibagi 30, bebannya rata (~22 game/hari) dan
# tiap game tetap tersegarkan dalam sebulan.
#
# Jatah harian DIHITUNG (total ÷ 30), tidak dipatok. Katalog tumbuh terus — 544
# game enam hari lalu, 632 hari ini — dan angka mati akan diam-diam
# memperpanjang siklusnya tiap kali katalog bertambah.
#
# Gilirannya dicatat di worker/data/ikon-giliran-*.json, BUKAN dari mtime berkas:
# di CI semua berkas datang dari `git checkout` sehingga mtime-nya seragam, dan
# pemilihan giliran akan mengulang game yang sama terus.
name: segarkan-ikon

on:
  schedule:
    - cron: "0 20 * * *" # tiap hari 03:00 WIB (20:00 UTC hari sebelumnya)
  workflow_dispatch:
    inputs:
      penuh:
        description: "Tarik ULANG SEMUA ikon sekaligus (abaikan giliran — ratusan permintaan)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: segarkan-ikon
  cancel-in-progress: false

jobs:
  ikon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # sharp WAJIB. Tanpa sharp, fetch-icons menulis ikon ukuran ASLI (>=512px)
      # ke folder situs — bukan cuma gagal mengecilkan, tapi membengkakkan aset
      # yang dikirim ke pengunjung.
      - name: Pasang deps
        run: cd worker && npm i --no-audit --no-fund

      - name: Segarkan giliran hari ini
        run: |
          MODE="--gilir"
          if [ "${{ inputs.penuh }}" = "true" ]; then MODE="--force"; fi
          node worker/fetch-icons.mjs $MODE
          node worker/fetch-roblox-icons.mjs $MODE || echo "ikon roblox gagal, lanjut"

      - name: Commit bila ada yang berubah
        run: |
          git config user.name "kodegg-bot"
          git config user.email "bot@kodegg.com"
          git add site/public/assets/games site/public/assets/roblox worker/data/ikon-besar worker/data/ikon-giliran-*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "giliran hari ini tak menghasilkan perubahan ikon."
            exit 0
          fi
          # Catatan giliran SELALU berubah tiap hari, jadi hitung gambarnya saja —
          # kalau tidak, ringkasannya akan selalu bilang "ada yang berubah".
          GAMBAR=$(git diff --cached --name-only | grep -cE '\.(png|webp)$' || true)
          git commit -m "chore(ikon): segarkan $GAMBAR ikon (giliran harian)"
          git push
          echo "$GAMBAR ikon diperbarui hari ini." >> "$GITHUB_STEP_SUMMARY"
